<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 90" width="280" height="90">
  <defs>
    <style>
      .lg-name { font-family: 'Cormorant Garamond', Georgia, serif; }
      .lg-sub  { font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <!-- Botanical sprig mark — centered at x=38 -->

  <!-- Stem -->
  <path d="M38,78 L38,10" stroke="#5C7A5E" stroke-width="0.9" stroke-linecap="round" fill="none"/>

  <!-- Lower left leaf -->
  <path d="M38,65 C25,58 23,45 38,43" fill="#5C7A5E" opacity="0.72"/>
  <!-- Lower right leaf -->
  <path d="M38,65 C51,58 53,45 38,43" fill="#5C7A5E" opacity="0.55"/>

  <!-- Upper left leaf -->
  <path d="M38,41 C25,34 23,22 38,20" fill="#5C7A5E" opacity="0.88"/>
  <!-- Upper right leaf -->
  <path d="M38,41 C51,34 53,22 38,20" fill="#5C7A5E" opacity="0.68"/>

  <!-- Top bud -->
  <path d="M38,20 C34,12 34,6 38,3 C42,6 42,12 38,20" fill="#5C7A5E"/>

  <!-- Divider -->
  <line x1="64" y1="18" x2="64" y2="74" stroke="#B8CCBA" stroke-width="0.7"/>

  <!-- Name lines -->
  <text x="78" y="44" class="lg-name" font-size="22" font-weight="400" fill="#2C2C2A" letter-spacing="2.8">ALEJANDRA</text>
  <text x="78" y="67" class="lg-name" font-size="22" font-weight="400" fill="#2C2C2A" letter-spacing="2.8">HERNÁNDEZ</text>

  <!-- Subtitle -->
  <text x="79" y="80" class="lg-sub" font-size="7" font-weight="400" fill="#5C7A5E" letter-spacing="4">PSICOTERAPIA</text>
</svg>
